<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>ฟอร์มการติดต่อ (Contact Us)</h1>
    <hr class="divider">

    <!-- ฟอร์มการติดต่อพื้นฐาน -->
    <form action="#" method="post">
        <p>
            <label for="name">ชื่อ-นามสกุล:</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">อีเมล:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="message">ข้อความ:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea>
        </p>

        <p>
            <button type="submit">ส่งข้อความ</button>
        </p>
    </form>

    <hr class="divider">

    <p>
        <a href="index.html">กลับไปหน้าแรก (index.html)</a>
    </p>

</body>

</html>
